<path d="M 40,83 a3,3 0 0 1 3,-3 h201 a3,3 0 0 1 3,3 v23 h-207 Z" fill="#17324f"/>
<text x="50" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff">unidade_seguranca</text>
<text x="50" y="119" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK id_unidade INT UNSIGNED AI</text>
<text x="50" y="136" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   nome       VARCHAR(120) NN</text>
<text x="50" y="153" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   tipo       ENUM NN</text>
<text x="50" y="170" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   telefone   VARCHAR(20)</text>
<text x="50" y="187" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   email      VARCHAR(120) UQ</text>
<text x="50" y="204" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   ativo      BOOLEAN NN</text>
<rect x="440" y="80" width="226" height="151" rx="3" fill="#ffffff" stroke="#17324f" stroke-width="1.8"/>
<path d="M 440,83 a3,3 0 0 1 3,-3 h220 a3,3 0 0 1 3,3 v23 h-226 Z" fill="#17324f"/>
<text x="450" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff">equipe</text>
<text x="450" y="119" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK id_equipe     INT UNSIGNED AI</text>
<text x="450" y="136" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   nome          VARCHAR(80) NN</text>
<text x="450" y="153" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   turno         ENUM NN</text>
<text x="450" y="170" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   especialidade VARCHAR(60)</text>
<text x="450" y="187" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">FK id_unidade    INT UNSIGNED NN</text>
<text x="450" y="204" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   ativa         BOOLEAN NN</text>
<text x="450" y="221" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="normal">UQ (nome, id_unidade)</text>
<rect x="40" y="340" width="245" height="168" rx="3" fill="#ffffff" stroke="#17324f" stroke-width="1.8"/>
<path d="M 40,343 a3,3 0 0 1 3,-3 h239 a3,3 0 0 1 3,3 v23 h-245 Z" fill="#17324f"/>
<text x="50" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff">veiculo</text>
<text x="50" y="379" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK id_veiculo     INT UNSIGNED AI</text>
<text x="50" y="396" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   prefixo        VARCHAR(20) NN UQ</text>
<text x="50" y="413" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   placa          CHAR(7) NN UQ</text>
<text x="50" y="430" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   tipo           ENUM NN</text>
<text x="50" y="447" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   modelo         VARCHAR(60)</text>
<text x="50" y="464" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   ano            SMALLINT UNSIGNED</text>
<text x="50" y="481" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">   status_veiculo ENUM NN</text>
<text x="50" y="498" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">FK id_unidade     INT UNSIGNED</text>
<rect x="440" y="340" width="245" height="134" rx="3" fill="#ffffff" stroke="#17324f" stroke-width="1.8"/>
<path d="M 440,343 a3,3 0 0 1 3,-3 h239 a3,3 0 0 1 3,3 v23 h-245 Z" fill="#17324f"/>
<text x="450" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff">equipe_agente</text>
<text x="450" y="379" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK,FK id_equipe        INT UNSIGNED</text>
<text x="450" y="396" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK,FK id_agente        INT UNSIGNED</text>
<text x="450" y="413" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK    data_inicio      DATE</text>
<text x="450" y="430" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">      data_fim         DATE</text>
<text x="450" y="447" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">      funcao_na_equipe ENUM NN</text>
<text x="450" y="464" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#12283c" font-weight="normal">CHECK data_fim &gt;= data_inicio</text>
<rect x="440" y="580" width="181" height="49" rx="3" fill="#ffffff" stroke="#17324f" stroke-width="1.8"/>
<path d="M 440,583 a3,3 0 0 1 3,-3 h175 a3,3 0 0 1 3,3 v23 h-181 Z" fill="#17324f"/>
<text x="450" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff">agente</text>
<text x="450" y="619" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="10.5" fill="#8a3a00" font-weight="bold">PK id_pessoa INT UNSIGNED</text>
<text x="40" y="678" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#4a5a68">PK = chave primária | FK = chave estrangeira | UQ = restrição de unicidade | NN = obrigatório | AI = auto incremento</text>
</svg>